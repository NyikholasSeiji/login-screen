<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Bem-vindo</h1>
    <p class="subtitle">Faça login para continuar</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="username">
        <small class="error" id="email-error"></small>
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Sua senha" autocomplete="current-password">
          <button type="button" id="toggle-password" class="toggle">Mostrar</button>
        </div>
        <small class="error" id="password-error"></small>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember"> Lembrar de mim
        </label>
        <a href="#" id="forgot">Esqueci a senha</a>
      </div>

      <button type="submit" id="submit" class="btn">Entrar</button>

      <div id="message" class="message" role="alert"></div>
    </form>

    <p class="hint">Teste: <strong>admin@email.com</strong> / <strong>123456</strong></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
